name: Publish to allminecraft
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew build
      - uses: allminecraft/publish-action@v1
        with:
          post-id: 221
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
